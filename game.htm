<!DOCTYPE html>
<html>
<head>
    <title>Catch the Ball Game</title>
    <style>
        body {
            margin: 0;
            text-align: center;
            font-family: Arial;
            background: #111;
            color: white;
        }

        canvas {
            background: #222;
            border: 3px solid white;
            margin-top: 20px;
        }

        button {
            padding: 10px 25px;
            font-size: 18px;
            margin: 10px;
        }
    </style>
</head>

<body>

<h1>🎮 Catch the Ball</h1>
<p>Move the basket using ← → keys</p>

<canvas id="game" width="400" height="500"></canvas>
<br>
<button onclick="restartGame()">Restart</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let basket = {
    x: 160,
    y: 450,
    width: 80,
    height: 20,
    speed: 7
};

let ball = {
    x: Math.random() * 380,
    y: 0,
    radius: 10,
    speed: 4
};

let score = 0;
let gameOver = false;

let left = false;
let right = false;

document.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") left = true;
    if (e.key === "ArrowRight") right = true;
});

document.addEventListener("keyup", e => {
    if (e.key === "ArrowLeft") left = false;
    if (e.key === "ArrowRight") right = false;
});

function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (left && basket.x > 0)
        basket.x -= basket.speed;

    if (right && basket.x < canvas.width - basket.width)
        basket.x += basket.speed;

    // Basket
    ctx.fillStyle = "lime";
    ctx.fillRect(basket.x, basket.y, basket.width, basket.height);

    // Ball
    ctx.fillStyle = "red";
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fill();

    ball.y += ball.speed;

    // Catch
    if (
        ball.y + ball.radius >= basket.y &&
        ball.x >= basket.x &&
        ball.x <= basket.x + basket.width
    ) {
        score++;
        ball.y = 0;
        ball.x = Math.random() * (canvas.width - 20) + 10;
        ball.speed += 0.3;
    }

    // Miss
    if (ball.y > canvas.height) {
        gameOver = true;
    }

    ctx.fillStyle = "white";
    ctx.font = "20px Arial";
    ctx.fillText("Score: " + score, 10, 25);

    if (gameOver) {
        ctx.font = "40px Arial";
        ctx.fillText("GAME OVER", 90, 250);
        return;
    }

    requestAnimationFrame(gameLoop);
}

function restartGame() {
    score = 0;
    gameOver = false;
    basket.x = 160;
    ball.y = 0;
    ball.speed = 4;
    gameLoop();
}

gameLoop();
</script>
</body>
</html>
